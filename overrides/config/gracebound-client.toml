#Whether the guidance effect fades in and out.
enableFade = true
#Ticks used to fade guidance in.
# Default: 10
# Range: 0 ~ 200
fadeInTicks = 10
#Ticks used to fade guidance out.
# Default: 20
# Range: 0 ~ 200
fadeOutTicks = 20
#Controls how many wispy strands are drawn in the guidance stream.
# Default: 0.62
# Range: 0.1 ~ 4.0
beamDensity = 0.62
#Forward offset from your eyes where the stream is anchored.
# Default: 0.0
# Range: 0.0 ~ 2.0
beamOriginOffset = 0.0
#Extra distance from the anchor before particles begin rendering.
# Default: 0.0
# Range: 0.0 ~ 3.0
beamStartDistance = 0.0
#Vertical offset from eye level where the stream originates. Negative values lower it toward torso height.
# Default: -0.92
# Range: -2.0 ~ 1.0
beamVerticalOffset = -0.92
#Maximum visual length of the guidance stream in blocks.
# Default: 6.0
# Range: 4.0 ~ 96.0
maxBeamDistance = 6.0
#Visual style used for the guidance trail.
#Allowed Values: CLASSIC, ENCHANTED, AURORA, SIGIL
trailStyle = "ENCHANTED"
#Whether first-person guidance uses the fuller third-person trail presentation instead of the unobtrusive first-person presentation.
useThirdPersonTrailInFirstPerson = false
#Whether Gracebound shows small client-side guidance messages.
showMessages = true
#Whether lodestone-compass guidance is rendered.
showLodestoneGuidance = false
#Whether recovery-compass guidance is rendered.
showRecoveryCompassGuidance = true
#Whether regular-compass guidance (spawn guidance) is rendered.
showRegularCompassGuidance = false
